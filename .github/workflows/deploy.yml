name: Publicar Invexo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app (producción)
        run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Preparar routing de Angular para GitHub Pages
        run: cp dist/invexo/index.html dist/invexo/404.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/invexo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
